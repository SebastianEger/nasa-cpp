name: Firmware

on:
  push:
    branches: [ "main" ]
    paths: [ "firmware/**", "src/**", "msg/**", ".github/workflows/firmware.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "firmware/**", "src/**", "msg/**", ".github/workflows/firmware.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py build
          idf.py merge-bin -o nasa-cpp-esp32-full.bin

      # built with config.example.json: flash storage.bin from your own build with your settings
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nasa-cpp-esp32
          path: |
            firmware/build/nasa-cpp-esp32.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
