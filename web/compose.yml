# Standalone stack: MQTT broker + web dashboard.
#
#   docker compose up -d                      # broker + dashboard on http://localhost:8080
#   docker compose --profile demo up -d       # ... plus a simulated heat pump (no hardware needed)
#
# Point tcp_hass_bridge (cfg/tcp_hass_bridge.json -> mqtt.address) at this broker,
# or set MQTT_HOST below to an existing broker and remove the mosquitto service.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: nasa-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  nasa-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      target: runtime
    image: nasa-web:latest
    container_name: nasa-web
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8080:8080"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      # MQTT_USERNAME: ""
      # MQTT_PASSWORD: ""
      RETENTION_DAYS: 365
      READ_ONLY: "false"
      TZ: Europe/Berlin
    volumes:
      - nasa-web-data:/data

  simulator:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: web/Dockerfile
      target: demo
    image: nasa-web-demo:latest
    container_name: nasa-simulator
    restart: unless-stopped
    depends_on:
      - mosquitto
    command: ["--broker", "mosquitto", "--interval", "2"]

volumes:
  mosquitto-data:
  nasa-web-data:
