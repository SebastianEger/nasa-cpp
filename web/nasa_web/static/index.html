<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NASA EHS Monitor</title>
  <meta name="description" content="Live monitoring, history and control for Samsung EHS heat pumps via nasa-cpp">
  <meta name="theme-color" content="#0b0f17">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/uPlot.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply stored theme before first paint
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="nav">
      <div class="brand">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true">
          <defs>
            <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--heat)"/><stop offset="1" stop-color="var(--cool)"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bm)"/>
          <path d="M10 20c2-6 4 2 6-4s4 2 6-4" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="brand-text">
          <strong>NASA EHS</strong>
          <span>Heat pump monitor</span>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <a href="#overview" data-view="overview" role="tab">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg><span>Overview</span></a>
        <a href="#history" data-view="history" role="tab">
          <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9M14 7h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>History</span></a>
        <a href="#energy" data-view="energy" role="tab">
          <svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span>Energy</span></a>
        <a href="#settings" data-view="settings" role="tab">
          <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></a>
        <a href="#entities" data-view="entities" role="tab">
          <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Entities</span></a>
      </nav>
      <div class="nav-foot">
        <div class="conn" id="conn"><span class="dot"></span><span class="label">Connecting…</span></div>
        <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" class="i-moon"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="view-title">Overview</h1>
          <p id="view-sub" class="muted"></p>
        </div>
        <div class="topbar-right" id="topbar-right"></div>
      </header>
      <div id="view"></div>
    </main>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header>
        <div>
          <h2 id="drawer-title"></h2>
          <p class="muted" id="drawer-sub"></p>
        </div>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div id="drawer-body"></div>
    </section>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="vendor/uPlot.iife.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
